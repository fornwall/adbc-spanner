name: Resilience (fault injection)

# Transport-level fault-injection / resilience harness: the driver talks to the Spanner emulator
# THROUGH a Toxiproxy TCP proxy, and tests/resilience.rs injects latency/bandwidth/reset faults via
# Toxiproxy's admin API and asserts the driver behaves sanely (cancel interrupts an in-flight query;
# a connection reset surfaces a clean error and then recovers).
#
# GATING, on every push to main and every pull request (plus manual dispatch and a nightly run that
# additionally files a tracking issue on failure). It used to run nightly only, which meant the six
# tests in tests/resilience.rs contributed ZERO gating coverage: `cargo test --test resilience`
# appears nowhere else (ci.yml runs --test mock_spanner / --lib / --doc / --test integration, never a
# bare `cargo test`), so a transport-handling regression could merge and only be noticed the next
# morning. Making it gating was affordable because the suite is cheap and its margins are wide: the
# whole Docker bring-up + 6 tests measured ~40s wall-clock locally (test time ~28s), and every timing
# assertion runs an order of magnitude inside its bound (cancel lands in ~2ms against a 4s bound; the
# 2s RPC deadline fires in ~2.0s against a 15s bound; the watchdogs are 20-45s against a 28s whole
# suite). The job is kept in its own workflow rather than folded into ci.yml because it needs its own
# Docker topology (an emulator with no published ports plus a host-network Toxiproxy, wired by
# scripts/with-toxiproxy.sh) which would collide with ci.yml's emulator *service container*, and
# because the nightly + issue-reporting leg belongs next to it.
#
# NOTE for repo admins: a check from any workflow only *blocks* a merge once branch protection lists
# it as required — add "Resilience harness (emulator + Toxiproxy)" there. If it ever turns flaky,
# demote it back to schedule-only rather than letting a red-but-ignored check erode the gate.
#
# Honest scope: Toxiproxy injects TRANSPORT faults only — it cannot make the emulator emit a gRPC
# status such as ABORTED, so this harness does NOT cover Spanner's ABORTED-driven transaction replay.
# See tests/RESILIENCE.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly at 04:30 UTC. The nightly run adds the tracking-issue leg below; the gating value
    # comes from the push/pull_request triggers.
    - cron: "30 4 * * *"

# Cancel superseded PR runs (a rapid re-push cancels the in-flight run for the same
# ref); pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resilience:
    name: Resilience harness (emulator + Toxiproxy)
    runs-on: ubuntu-latest
    # The suite bounds every test with its own watchdog and runs in well under a minute; this is the
    # backstop for a hang *outside* the tests (a Docker pull or an emulator that never comes up), so
    # a wedged gating job fails in minutes instead of burning the default 6h.
    timeout-minutes: 30

    # `with-toxiproxy.sh` exports TOXIPROXY_URL / SPANNER_EMULATOR_HOST for the test; this makes the
    # `toxi()` gate panic instead of self-skipping if that wiring ever breaks, so the resilience
    # suite can't pass vacuously. Inherited by the cargo-test subprocess the script spawns.
    env:
      ADBC_TEST_REQUIRE_TARGET: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Build first so the cdylib/test binary is ready; the harness script then only spins up Docker
      # and runs the already-compiled test. `with-toxiproxy.sh` manages both containers (emulator with
      # no host ports, reached by container IP so the admin port remap keeps working; Toxiproxy on the
      # host network) and exports SPANNER_EMULATOR_HOST / SPANNER_EMULATOR_DIRECT / TOXIPROXY_URL.
      - name: Build
        run: cargo build --tests

      - name: Run the resilience harness
        run: |
          scripts/with-toxiproxy.sh \
            cargo test --test resilience -- --nocapture --test-threads=1

  # A scheduled resilience failure otherwise surfaces only as an email, and a scheduled workflow
  # that keeps failing (or that nobody watches) auto-disables after 60 days of inactivity. Open —
  # or comment on an already-open — tracking issue so a nightly regression stays visible in the repo.
  # Only fires on the nightly `schedule` trigger, never on manual `workflow_dispatch` runs.
  report-failure:
    needs: resilience
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Least privilege: only this job needs to write issues.
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="nightly-resilience-failure"
          title="Nightly resilience run failed"
          # Idempotent: ensure the tracking label exists, then reuse an already-open issue instead
          # of opening a fresh one every night.
          gh label create "$label" --color B60205 \
            --description "Automated: a scheduled resilience run failed" 2>/dev/null || true
          body="A scheduled [resilience run]($RUN_URL) failed (commit ${GITHUB_SHA})."
          existing="$(gh issue list --state open --label "$label" --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
