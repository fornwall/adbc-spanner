[build-system]
# >=77 for the PEP 639 string `license` + `license-files` below; it also vendors
# bdist_wheel, so the separate `wheel` requirement is gone.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adbc-driver-spanner"
dynamic = ["version"]
description = "ADBC (Arrow Database Connectivity) driver for Google Cloud Spanner"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# A checked-in copy of the repository's LICENSE (Apache-2.0 §4 requires shipping the
# license text with the wheel, which bundles the compiled driver).
license-files = ["LICENSE"]
authors = [{ name = "Fredrik Fornwall", email = "fredrik@fornwall.net" }]
keywords = ["adbc", "arrow", "spanner", "database", "gcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Database",
]
# >=1.0 covers everything the wrapper uses (AdbcDatabase/dbapi.connect with
# driver/entrypoint, dbapi autocommit) and keeps pip off ancient pre-1.0 releases.
dependencies = ["adbc-driver-manager>=1.0"]

[project.optional-dependencies]
# Arrow/DataFrame result helpers used by the DBAPI layer (fetch_arrow_table/fetch_df).
# `adbc_driver_spanner.dbapi` is a thin wrapper over `adbc_driver_manager.dbapi`, so
# delegate to that package's own `dbapi` extra (pyarrow + pandas) instead of
# maintaining a second, drifting floor here — the old standalone `pyarrow>=8` sat
# below the `pyarrow>=14.0.1` the driver manager actually requires. The explicit
# pyarrow floor is kept so `pip install adbc-driver-spanner[dbapi]` still states the
# Arrow requirement the docs talk about.
dbapi = ["adbc-driver-manager[dbapi]>=1.0", "pyarrow>=14.0.1"]

[project.scripts]
# Writes an ADBC driver manifest (spanner.toml) pointing at the library bundled in
# this wheel, so the driver resolves as driver="spanner" / uri="spanner:///...".
# The manifest cannot simply be shipped as a data file: Driver.shared is handed to
# the dynamic loader verbatim (no manifest-relative resolution in either the C or
# the Rust driver manager), so the absolute install path must be filled in after
# installation. See adbc_driver_spanner/manifest.py.
adbc-driver-spanner-install-manifest = "adbc_driver_spanner.manifest:main"

[project.urls]
Homepage = "https://github.com/fornwall/adbc-spanner"
Repository = "https://github.com/fornwall/adbc-spanner"

[tool.setuptools]
packages = ["adbc_driver_spanner"]

[tool.setuptools.dynamic]
version = { attr = "adbc_driver_spanner._version.__version__" }

[tool.setuptools.package-data]
# The prebuilt shared library is dropped in by CI per platform before the wheel
# is built. py.typed ships the type-hint marker.
adbc_driver_spanner = ["*.so", "*.dylib", "*.dll", "py.typed"]
